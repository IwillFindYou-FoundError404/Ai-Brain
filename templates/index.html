<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><title>Astra Brain Runtime</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f1115; color: #e2e8f0; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 650px; background: #161920; border-radius: 12px; height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .chat-box { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 8px; max-width: 80%; font-size: 15px; line-height: 1.4; }
        .msg.user { background: #007bff; align-self: flex-end; }
        .msg.ai { background: #232834; align-self: flex-start; }
        .canvas-box { display: block; margin-top: 8px; background: #000; border: 1px solid #384152; border-radius: 6px; }
        .input-box { padding: 15px; border-top: 1px solid #232834; display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; background: #0a0c10; border: 1px solid #384152; border-radius: 6px; color: #fff; }
        button { padding: 12px 20px; background: #007bff; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-box" id="box">
        <div class="msg ai">🤖 <b>Astra Brain:</b> Sẵn sàng điều phối xử lý. Nhập câu chữ bất kỳ, hoặc chứa từ "ảnh", "video" để kiểm tra phản xạ không gian.</div>
    </div>
    <div class="input-box">
        <input type="text" id="inp" placeholder="Nhập tin nhắn tại đây..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">Gửi</button>
    </div>
</div>
<script>
async function send() {
    const inp = document.getElementById('inp'); const txt = inp.value.trim(); if(!txt) return;
    const box = document.getElementById('box');
    
    const uDiv = document.createElement('div'); uDiv.className = 'msg user'; uDiv.innerText = txt; box.appendChild(uDiv);
    inp.value = ''; box.scrollTop = box.scrollHeight;

    const res = await fetch('/agent/run', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: txt}) });
    const dict = await res.json();
    
    const aiDiv = document.createElement('div'); aiDiv.className = 'msg ai';
    if(dict.type === 'text') {
        aiDiv.innerHTML = `🤖 <b>AI Decision:</b> Hệ câu này thuộc [${dict.data.decision}]`;
        box.appendChild(aiDiv);
    } else if(dict.type === 'image') {
        aiDiv.innerHTML = `🖼️ <b>AI Image:</b> Đã sinh ảnh không gian tĩnh cấu trúc 3D:`;
        drawMatrix(aiDiv, dict.data.pixel_matrix);
        box.appendChild(aiDiv);
    } else if(dict.type === 'video_stream') {
        aiDiv.innerHTML = `🎬 <b>AI Video Stream:</b> Đang thu tín hiệu luồng 24 FPS...<br><span id="meta" style="font-size:11px;color:#888;"></span>`;
        const canvas = drawMatrix(aiDiv, Array(40).fill(Array(40).fill(0)));
        box.appendChild(aiDiv);
        
        const src = new EventSource('/agent/stream-video');
        src.onmessage = function(e) {
            const data = JSON.parse(e.data);
            if(data.end_demo) { src.close(); document.getElementById('meta').innerText = "⏸️ Luồng tiếp tục chạy ngầm định dạng 2 tiếng..."; return; }
            document.getElementById('meta').innerText = `Khung hình: ${data.frame} | Trục Z camera: ${data.camera_z.toFixed(2)}m`;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = "#000"; ctx.fillRect(0,0,40,40);
            for(let y=0; y<data.pixel_matrix.length; y++) {
                for(let x=0; x<data.pixel_matrix[y].length; x++) {
                    if(data.pixel_matrix[y][x] > 0) { ctx.fillStyle = "#fff"; ctx.fillRect(x,y,1,1); }
                }
            }
        };
    }
    box.scrollTop = box.scrollHeight;
}

function drawMatrix(el, matrix) {
    const cv = document.createElement('canvas'); cv.className = 'canvas-box'; cv.width = 40; cv.height = 40; cv.style.width = '200px'; cv.style.height = '200px';
    el.appendChild(cv); const ctx = cv.getContext('2d'); ctx.fillStyle = "#000"; ctx.fillRect(0,0,40,40);
    ctx.fillStyle = "#fff";
    for(let y=0; y<matrix.length; y++) {
        for(let x=0; x<matrix[y].length; x++) { if(matrix[y][x]>0) ctx.fillRect(x,y,1,1); }
    }
    return cv;
}
</script>
</body>
</html>
